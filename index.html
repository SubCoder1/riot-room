<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Riot Room</title>
    <!-- The first thing painted, before the game's code has even downloaded:
         the dark screen with the title, so the page is never blank. The game's
         own loading screen (same place, same look) replaces it. -->
    <style>
      html,
      body {
        margin: 0;
        background: #05070a;
      }
      #boot {
        position: fixed;
        inset: 0;
        z-index: 100;
        display: flex;
        align-items: center;
        justify-content: center;
        padding-bottom: 84px;
        background: #05070a;
        color: #e8edf3;
        font: 56px/1.2 Impact, "Arial Narrow", sans-serif;
        letter-spacing: 0.14em;
      }
    </style>
  </head>
  <body>
    <div id="boot" aria-hidden="true">RIOT ROOM</div>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
